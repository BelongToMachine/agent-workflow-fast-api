name: asianode-production-frontend

services:
  frontend:
    build:
      # RELEASE is supplied by deploy-frontend-production.sh. The default
      # keeps this Compose file usable from a checked-out release directory.
      context: ${RELEASE:-.}
      dockerfile: Dockerfile
      args:
        VITE_FASTAPI_URL: ${FRONTEND_API_URL:?FRONTEND_API_URL is required}
        NEXT_PUBLIC_FASTAPI_BASE_URL: ${FRONTEND_API_URL:?FRONTEND_API_URL is required}
        VITE_WORKSPACE_ID: ${VITE_WORKSPACE_ID:?VITE_WORKSPACE_ID is required}
        VITE_SINGLE_WORKSPACE_MODE: ${VITE_SINGLE_WORKSPACE_MODE:-true}
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-fastapi-direct}
        NEXT_PUBLIC_USE_FASTAPI_BACKEND: ${NEXT_PUBLIC_USE_FASTAPI_BACKEND:-1}
    # Cloudflare Tunnel should target this loopback port after cutover.
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_HOST_PORT:-18100}:8080"
    restart: unless-stopped
    init: true
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    cap_drop:
      - ALL
    # The official Nginx image starts as root, prepares its cache, and then
    # drops workers to the nginx user. Rootless Docker still needs these
    # namespaced capabilities for that startup sequence.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run
      - /tmp:size=16m,mode=1777
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz && wget -q -O /dev/null http://127.0.0.1:8080/favicon.png"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend_internal

networks:
  frontend_internal:
    name: asianode-production-frontend-internal
