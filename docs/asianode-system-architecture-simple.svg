<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">Asianode Agent simplified architecture</title>
  <desc id="desc">A simple three-column architecture diagram showing the React and Vite frontend, FastAPI backend, and PostgreSQL, Redis, storage, identity and AI integrations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#edf3f9"/>
    </linearGradient>
    <linearGradient id="backend" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16366c"/>
      <stop offset="1" stop-color="#0d2349"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10243f" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b72c7"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#13a6a0"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .ink { fill: #10233f; }
      .muted { fill: #61738a; }
      .white { fill: #f7fbff; }
      .dbmuted { fill: #b2c6dc; }
      .eyebrow { font-size: 17px; font-weight: 750; letter-spacing: 3px; }
      .title { font-size: 42px; font-weight: 760; letter-spacing: -1px; }
      .subtitle { font-size: 21px; font-weight: 450; }
      .section { font-size: 18px; font-weight: 760; letter-spacing: 1px; }
      .card-title { font-size: 28px; font-weight: 760; }
      .body { font-size: 19px; font-weight: 500; }
      .small { font-size: 16px; font-weight: 500; }
      .label { font-size: 13px; font-weight: 760; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1800" height="1100" fill="url(#bg)"/>
  <rect x="32" y="32" width="1736" height="1036" rx="28" fill="none" stroke="#d9e3ef" stroke-width="2"/>

  <!-- Header -->
  <text x="78" y="88" class="sans eyebrow" fill="#2b72c7">ASIANODE AGENT</text>
  <text x="78" y="140" class="sans title ink">Simple System Architecture</text>
  <text x="78" y="177" class="sans subtitle muted">A client-facing view of the current React / Vite + FastAPI platform</text>
  <rect x="1430" y="70" width="282" height="42" rx="21" fill="#e5f2ff" stroke="#bdd9f3"/>
  <text x="1571" y="97" text-anchor="middle" class="sans label" fill="#2b72c7">CLIENT OVERVIEW</text>

  <!-- Main flow arrows -->
  <path d="M520 505 H626" fill="none" stroke="#2b72c7" stroke-width="6" marker-end="url(#arrow-blue)"/>
  <path d="M1172 505 H1278" fill="none" stroke="#13a6a0" stroke-width="6" marker-end="url(#arrow-teal)"/>
  <rect x="530" y="472" width="86" height="28" rx="14" fill="#eaf4ff"/>
  <text x="573" y="491" text-anchor="middle" class="sans label" fill="#2b72c7">HTTPS</text>
  <rect x="1182" y="472" width="86" height="28" rx="14" fill="#e8fbf8"/>
  <text x="1225" y="491" text-anchor="middle" class="sans label" fill="#138b86">SQL / API</text>

  <!-- Frontend -->
  <g filter="url(#shadow)">
    <rect x="78" y="270" width="442" height="560" rx="24" fill="#ffffff" stroke="#b9d9f6" stroke-width="2"/>
  </g>
  <rect x="78" y="270" width="442" height="82" rx="24" fill="#eaf4ff"/>
  <rect x="78" y="328" width="442" height="24" fill="#eaf4ff"/>
  <text x="112" y="320" class="sans section" fill="#2b72c7">1 · FRONTEND</text>
  <text x="112" y="402" class="sans card-title ink">React + Vite SPA</text>
  <text x="112" y="434" class="sans body muted">The user-facing workspace.</text>

  <circle cx="130" cy="497" r="11" fill="#2b72c7"/>
  <text x="158" y="504" class="sans body ink">Chat and AI interaction</text>
  <circle cx="130" cy="561" r="11" fill="#2b72c7"/>
  <text x="158" y="568" class="sans body ink">Knowledge base management</text>
  <circle cx="130" cy="625" r="11" fill="#2b72c7"/>
  <text x="158" y="632" class="sans body ink">Documents and artifacts</text>
  <circle cx="130" cy="689" r="11" fill="#2b72c7"/>
  <text x="158" y="696" class="sans body ink">Workspace administration</text>

  <rect x="112" y="755" width="374" height="44" rx="22" fill="#f0f7ff"/>
  <text x="299" y="783" text-anchor="middle" class="sans label" fill="#2b72c7">AUTH-AWARE API ADAPTER + SSE</text>

  <!-- Backend -->
  <g filter="url(#shadow)">
    <rect x="626" y="270" width="546" height="560" rx="24" fill="url(#backend)" stroke="#31598d" stroke-width="2"/>
  </g>
  <text x="664" y="320" class="sans section" fill="#9dccfa">2 · BACKEND</text>
  <text x="664" y="402" class="sans card-title white">FastAPI service</text>
  <text x="664" y="434" class="sans body" fill="#bfd0e3">Business logic and security boundary.</text>

  <rect x="664" y="472" width="470" height="66" rx="14" fill="#1b447e" stroke="#396797"/>
  <text x="694" y="501" class="sans body white">API + authentication</text>
  <text x="694" y="525" class="sans small" fill="#c1d2e6">Bearer token · workspace permissions · rate limits</text>

  <rect x="664" y="558" width="470" height="66" rx="14" fill="#f7fbff"/>
  <text x="694" y="587" class="sans body ink">Chat, Agent and SSE</text>
  <text x="694" y="611" class="sans small muted">Streaming responses and read-only tools</text>

  <rect x="664" y="644" width="470" height="66" rx="14" fill="#f7fbff"/>
  <text x="694" y="673" class="sans body ink">Knowledge workflows</text>
  <text x="694" y="697" class="sans small muted">Upload → extract → chunk → search</text>

  <rect x="664" y="730" width="470" height="66" rx="14" fill="#f7fbff"/>
  <text x="694" y="759" class="sans body ink">Business APIs</text>
  <text x="694" y="783" class="sans small muted">Products · content · documents · admin</text>

  <!-- Data and integrations -->
  <g filter="url(#shadow)">
    <rect x="1278" y="270" width="444" height="560" rx="24" fill="#ffffff" stroke="#bce9e4" stroke-width="2"/>
  </g>
  <rect x="1278" y="270" width="444" height="82" rx="24" fill="#e8fbf8"/>
  <rect x="1278" y="328" width="444" height="24" fill="#e8fbf8"/>
  <text x="1312" y="320" class="sans section" fill="#138b86">3 · DATA &amp; SERVICES</text>
  <text x="1312" y="402" class="sans card-title ink">Platform resources</text>
  <text x="1312" y="434" class="sans body muted">Persistent data plus replaceable providers.</text>

  <rect x="1312" y="472" width="376" height="74" rx="14" fill="#f1f8ff" stroke="#d7e8f7"/>
  <text x="1342" y="503" class="sans body ink">PostgreSQL + pgvector</text>
  <text x="1342" y="528" class="sans small muted">Users · workspaces · chats · knowledge</text>

  <rect x="1312" y="562" width="376" height="58" rx="14" fill="#f8fffe" stroke="#d4f0ed"/>
  <text x="1342" y="598" class="sans body ink">Redis</text>
  <text x="1448" y="598" class="sans small muted">rate limits + resumable SSE</text>

  <rect x="1312" y="636" width="376" height="58" rx="14" fill="#fff8f1" stroke="#f5dfc8"/>
  <text x="1342" y="672" class="sans body ink">Object storage</text>
  <text x="1510" y="672" class="sans small muted">local or S3-compatible</text>

  <rect x="1312" y="710" width="376" height="58" rx="14" fill="#f8f5ff" stroke="#e4dbf7"/>
  <text x="1342" y="746" class="sans body ink">Logto + AI providers</text>
  <text x="1342" y="790" class="sans small muted">OIDC · chat model · embeddings</text>

  <!-- Simple flow explanation -->
  <rect x="78" y="888" width="1644" height="96" rx="20" fill="#ffffff" stroke="#d7e2ee" filter="url(#shadow)"/>
  <circle cx="122" cy="936" r="16" fill="#2b72c7"/>
  <path d="M122 927 v11 M122 944 v2" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="158" y="928" class="sans section" fill="#2b72c7">MAIN REQUEST FLOW</text>
  <text x="158" y="958" class="sans body muted">User request → authenticated workspace check → FastAPI orchestration → database / AI provider → streamed response</text>

  <text x="78" y="1030" class="sans small muted">KnowledgeSource is retained for migration compatibility; KnowledgeBase is the target independent entity.</text>
  <text x="1722" y="1030" text-anchor="end" class="sans label" fill="#61738a">CLIENT-FACING OVERVIEW</text>
</svg>
