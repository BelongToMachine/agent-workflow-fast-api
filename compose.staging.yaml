name: asianode-staging

services:
  api:
    build:
      # RELEASE is supplied by the staging deployment command. Keeping the
      # default as "." also lets this file work from a release directory.
      context: ${RELEASE:-.}
      dockerfile: Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    env_file:
      - ${RUNTIME_ENV_FILE:-/home/asianode/asianode-staging/shared/env/.env.staging}
    # Local-only access for now; no public port or Cloudflare mapping.
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    # Persist uploaded knowledge files outside the immutable release. The
    # staging default is separate from production and can be overridden in
    # the staging build environment when needed.
    volumes:
      - ${KNOWLEDGE_STORAGE_HOST_DIR:-/home/asianode/asianode-staging/shared/storage}:/app/storage/knowledge
    tmpfs:
      - /tmp:size=64m,mode=1777
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asianode_internal

  redis:
    image: redis:7-alpine
    # Run as the image's non-root user so rootless Docker does not need setpriv.
    user: "redis"
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 256m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - asianode_internal

networks:
  asianode_internal:
    name: asianode-staging-internal
