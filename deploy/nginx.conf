map $http_accept_encoding $brotli_suffix {
    default "";
    "~*br" ".br";
}

map $brotli_suffix $brotli_encoding {
    default "";
    ".br" "br";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Container and host-level health check. Keep this response independent
    # of the SPA so a broken asset bundle is visible as a failed deployment.
    location = /healthz {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /index.html {
        try_files $uri$brotli_suffix $uri =404;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $brotli_encoding always;
    }

    # Vite assets are content-addressed in production and can be cached for a
    # long time. Missing assets must not silently fall back to index.html.
    location /assets/ {
        try_files $uri$brotli_suffix $uri =404;
        add_header Vary "Accept-Encoding" always;
        add_header Content-Encoding $brotli_encoding always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # React Router needs the SPA fallback for direct navigation to a route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
