name: asianode-agent-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: asianode
      POSTGRES_PASSWORD: asianode
      POSTGRES_USER: asianode
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asianode -d asianode"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - asianode-postgres-data:/var/lib/postgresql/data

  redis:
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - asianode-redis-data:/data

volumes:
  asianode-postgres-data:
  asianode-redis-data:
